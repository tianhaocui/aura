apiVersion: v1
kind: ConfigMap
metadata:
  name: ${deploymentName}-config
data:
  AURA_PORT: "8080"
  AURA_ENV: "production"
  AURA_DEV_MODE: "false"
  AURA_PUBLIC_ORIGIN: "https://${deploymentName}.example.com"
  AURA_ALLOWED_HOSTS: "${deploymentName}.example.com"
  AURA_SECURITY_HEADERS: "true"
  AURA_OPENAPI: "false"
  AURA_ACCESS_LOG: "json"
  AURA_GZIP: "true"
  AURA_REQUEST_TIMEOUT: "30"
  AURA_HEALTH_CHECK_TIMEOUT: "2"
  AURA_SHUTDOWN_TIMEOUT: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${deploymentName}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${deploymentName}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${deploymentName}
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${deploymentName}:${version}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${deploymentName}-config
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: ${deploymentName}.example.com
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: ${deploymentName}.example.com
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: ${deploymentName}.example.com
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${deploymentName}
spec:
  selector:
    app.kubernetes.io/name: ${deploymentName}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${deploymentName}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${deploymentName}
