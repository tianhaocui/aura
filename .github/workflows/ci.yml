name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 23]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test + Coverage Check
        run: mvn verify --batch-mode --fail-at-end

      - name: Module and Documentation Contract
        run: bash scripts/verify-aura-contracts.sh

      - name: AI Golden Evaluation
        if: matrix.java == 17
        run: bash scripts/verify-ai-evals.sh

      - name: BOM, Starter, and Archetype Smoke
        if: matrix.java == 17
        run: bash scripts/verify-maven-archetype.sh

      - name: Upload Coverage Report
        if: always() && matrix.java == 17
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/target/site/jacoco/'
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
